<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barış'ın Almanca Dünyası - Giriş</title>

    <meta name="theme-color" content="#080d1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Mobilde taşma ve esneme problemlerini önlemek için */
            overscroll-behavior-y: none;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <!-- Üst boşluk ve esnek yapı için wrapper -->
    <div class="w-full flex-1 flex flex-col items-center justify-center p-6 text-center my-auto">
        <div class="max-w-2xl space-y-8 w-full">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 text-sm font-medium">
                <span class="flex h-2 w-2 rounded-full bg-sky-400 animate-ping"></span>
                🎯 A1 - A2 - B1 Almanca Öğrenme Portalı
            </div>
            
            <h1 class="text-4xl sm:text-6xl font-black text-white tracking-tight leading-tight">
                Barış'ın <span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-emerald-400 to-amber-400">Almanca Dünyası</span>
            </h1>
            
            <p class="text-slate-400 text-base sm:text-lg leading-relaxed max-w-xl mx-auto">
                Almanca A1 seviyesinden başlayarak interaktif alıştırmalar, sayı çalışma simülatörü, zamirler modülü ve özel not alanı ile dil pratiği yapın.
            </p>

            <!-- YÖNLENDİRME SEVİYE.HTML OLARAK GÜNCELLENDİ -->
            <button onclick="window.location.href='seviye.html'" class="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-bold text-lg rounded-2xl shadow-xl shadow-sky-500/20 hover:scale-105 transition-all duration-300 flex items-center justify-center gap-3 mx-auto">
                <i class="fa-solid fa-rocket"></i> Dünyaya Giriş Yap
            </button>
        </div>
    </div>

</body>
</html>
