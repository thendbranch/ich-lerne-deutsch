<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zamirler Alıştırması - Barış'ın Almanca Dünyası</title>

    <meta name="theme-color" content="#080d1a">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080d1a; color: #f1f5f9; }
        .trainer-card { background-color: #0f172a; border-color: #1e293b; }
        .option-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .option-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15); }
        .option-btn:active:not(:disabled) { transform: translateY(0); }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-emerald-500 selection:text-white relative">

    <!-- ÜST NAVİGASYON -->
    <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md sticky top-0 z-30 px-4 sm:px-8 py-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <button onclick="window.location.href='alistirmalar.html'" class="flex items-center gap-2 text-slate-400 hover:text-white font-semibold transition-all group">
                <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center group-hover:bg-slate-700 transition-colors">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </div>
                <span>Pratik Merkezine Dön</span>
            </button>
            <div class="flex items-center gap-3">
                <button onclick="showStageSelection()" title="Aşama Seçimine Dön" class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 text-xs font-bold transition-all flex items-center gap-1.5 border border-slate-700">
                    <i class="fa-solid fa-layer-group"></i> Aşamalar
                </button>
            </div>
        </div>
    </header>

    <!-- ANA İÇERİK -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 sm:p-8 space-y-6 flex flex-col justify-center">

        <!-- BAŞLIK -->
        <div class="text-center space-y-2 mb-2">
            <h1 class="text-2xl sm:text-3xl font-black text-white">Zamirler (Nominativ) Kampı</h1>
            <p class="text-sm text-slate-400 font-medium">Reflekslerini test et, Sie tuzağını boz ve cümleleri tamamla.</p>
        </div>

        <!-- AŞAMA SEÇİM EKRANI -->
        <div id="stage-selection" class="grid grid-cols-1 sm:grid-cols-2 gap-4 transition-all duration-500">
            <!-- Aşama 1 -->
            <button onclick="startStage(1)" class="trainer-card border rounded-[2rem] p-6 text-left hover:border-emerald-500/50 transition-all group">
                <div class="w-12 h-12 rounded-2xl bg-sky-500/10 text-sky-400 flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h3 class="text-lg font-bold text-white mb-1">1. Aşama: Hızlı Refleks</h3>
                <p class="text-xs text-slate-400">Temel zamir eşleştirmeleri. Hedef düşünmeden bulmak! (20 Soru)</p>
            </button>

            <!-- Aşama 2 -->
            <button onclick="startStage(2)" class="trainer-card border rounded-[2rem] p-6 text-left hover:border-emerald-500/50 transition-all group">
                <div class="w-12 h-12 rounded-2xl bg-rose-500/10 text-rose-400 flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <h3 class="text-lg font-bold text-white mb-1">2. Aşama: Sie Dedektifi</h3>
                <p class="text-xs text-slate-400">3 Farklı "Sie" kelimesini fiilden ve yapıdan ayırt etme. (20 Soru)</p>
            </button>

            <!-- Aşama 3 -->
            <button onclick="startStage(3)" class="trainer-card border rounded-[2rem] p-6 text-left hover:border-emerald-500/50 transition-all group">
                <div class="w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-puzzle-piece"></i>
                </div>
                <h3 class="text-lg font-bold text-white mb-1">3. Aşama: Eksik Parça</h3>
                <p class="text-xs text-slate-400">Fiil çekimlerine bakarak doğru özneyi bul. (20 Soru)</p>
            </button>

            <!-- Aşama 4 -->
            <button onclick="startStage(4)" class="trainer-card border border-emerald-500/30 rounded-[2rem] p-6 text-left hover:border-emerald-500 transition-all group bg-gradient-to-br from-slate-900 to-emerald-950/20 shadow-[0_0_15px_rgba(16,185,129,0.1)]">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-500 text-white flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition-transform shadow-lg shadow-emerald-500/30">
                    <i class="fa-solid fa-crown"></i>
                </div>
                <h3 class="text-lg font-bold text-emerald-400 mb-1">4. Aşama: Karma Final Sınavı</h3>
                <p class="text-xs text-slate-300">Tüm konulardan rastgele seçilmiş zorlu final testi! (40 Soru)</p>
            </button>
        </div>

        <!-- OYUN KARTI (Gizli başlar) -->
        <div id="quiz-card" class="hidden trainer-card border border-emerald-500/30 rounded-[2rem] shadow-2xl p-6 sm:p-8 space-y-6 relative overflow-hidden transition-all duration-500">
            <div class="absolute -right-20 -top-20 w-64 h-64 bg-emerald-500/5 blur-[80px] rounded-full pointer-events-none"></div>

            <div class="space-y-2 relative z-10">
                <div class="flex justify-between text-xs font-bold text-slate-400 uppercase tracking-wider">
                    <span id="current-stage-title">Aşama 1</span>
                    <span id="quiz-progress-text" class="text-emerald-400">1 / 20</span>
                </div>
                <div class="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
                    <div id="quiz-progress-bar" class="h-full bg-gradient-to-r from-emerald-500 to-teal-500 transition-all duration-300 shadow-[0_0_10px_rgba(16,185,129,0.5)]" style="width: 5%;"></div>
                </div>
            </div>

            <div class="bg-slate-950/80 border border-slate-800 rounded-3xl p-6 sm:p-10 text-center space-y-3 shadow-inner min-h-[160px] flex flex-col justify-center">
                <span id="question-type-badge" class="text-xs font-bold uppercase tracking-widest text-emerald-500 mb-2 block">Soru Tipi</span>
                <div id="question-text" class="text-2xl sm:text-3xl font-black text-white leading-tight">Yükleniyor...</div>
                <p id="question-hint" class="text-sm text-slate-400 font-medium mt-3 hidden">İpucu</p>
            </div>

            <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 relative z-10">
                <!-- Şıklar -->
            </div>
        </div>

    </main>

    <!-- SONUÇ MODALI -->
    <div id="result-modal" class="fixed inset-0 z-50 hidden bg-slate-950/95 backdrop-blur-md p-6 flex flex-col items-center justify-center transition-opacity">
        <div class="max-w-md w-full bg-gradient-to-b from-slate-900 to-slate-950 border border-emerald-500/40 rounded-[2.5rem] p-8 sm:p-10 text-center space-y-6 shadow-[0_0_50px_rgba(16,185,129,0.15)] relative overflow-hidden" id="modal-content-box">
            <div id="result-icon" class="w-24 h-24 mx-auto rounded-[2rem] bg-gradient-to-br from-emerald-400 to-teal-500 text-white flex items-center justify-center text-5xl shadow-lg shadow-emerald-500/30 mb-2">
                🎯
            </div>
            <div class="space-y-3 relative z-10">
                <h3 id="result-title" class="text-3xl font-black text-white">Aşama Bitti!</h3>
                <p id="result-desc" class="text-slate-400 text-sm sm:text-base leading-relaxed">Sonucunuz yükleniyor...</p>
                <div class="text-4xl font-black text-emerald-400 py-4" id="result-score">20 / 20</div>
            </div>
            <div class="grid grid-cols-2 gap-3 mt-4">
                <button onclick="window.location.href='alistirmalar.html'" class="w-full py-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold text-sm rounded-2xl transition-all">
                    Pratik Merkezi
                </button>
                <button id="btn-next-action" class="w-full py-4 bg-white hover:bg-slate-200 text-slate-950 font-extrabold text-sm rounded-2xl shadow-xl transition-all">
                    Devam Et <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>


    <script>
        const POOL_REFLEKS = [
            { label: '⚡ Refleks', q: 'Ben', a: 'ich', w: ['du', 'er', 'wir'] },
            { label: '⚡ Refleks', q: 'Sen', a: 'du', w: ['sie', 'ihr', 'es'] },
            { label: '⚡ Refleks', q: 'O (Erkek)', a: 'er', w: ['es', 'sie', 'ich'] },
            { label: '⚡ Refleks', q: 'O (Kadın)', a: 'sie', w: ['er', 'es', 'Sie'] },
            { label: '⚡ Refleks', q: 'O (Nötr)', a: 'es', w: ['er', 'sie', 'du'] },
            { label: '⚡ Refleks', q: 'Biz', a: 'wir', w: ['ihr', 'sie', 'Sie'] },
            { label: '⚡ Refleks', q: 'Siz (Samimi Çoğul)', a: 'ihr', w: ['wir', 'Sie', 'du'] },
            { label: '⚡ Refleks', q: 'Onlar', a: 'sie', w: ['Sie', 'wir', 'ihr'] },
            { label: '⚡ Refleks', q: 'Siz (Resmi Nezaket)', a: 'Sie', w: ['sie', 'ihr', 'wir'] },
            { label: '⚡ Çeviri', q: 'ich', a: 'Ben', w: ['Sen', 'O', 'Biz'] },
            { label: '⚡ Çeviri', q: 'du', a: 'Sen', w: ['Ben', 'Siz', 'Onlar'] },
            { label: '⚡ Çeviri', q: 'er', a: 'O (Erkek)', w: ['O (Kadın)', 'O (Nötr)', 'Sen'] },
            { label: '⚡ Çeviri', q: 'sie (tekil)', a: 'O (Kadın)', w: ['O (Erkek)', 'Onlar', 'Siz'] },
            { label: '⚡ Çeviri', q: 'es', a: 'O (Nötr)', w: ['O (Erkek)', 'O (Kadın)', 'Biz'] },
            { label: '⚡ Çeviri', q: 'wir', a: 'Biz', w: ['Siz', 'Onlar', 'Ben'] },
            { label: '⚡ Çeviri', q: 'ihr', a: 'Siz (Samimi)', w: ['Siz (Resmi)', 'Onlar', 'Biz'] },
            { label: '⚡ Çeviri', q: 'sie (çoğul)', a: 'Onlar', w: ['Siz (Samimi)', 'O (Kadın)', 'Biz'] },
            { label: '⚡ Çeviri', q: 'Sie (Büyük harf)', a: 'Siz (Resmi)', w: ['Siz (Samimi)', 'Onlar', 'O (Kadın)'] },
            { label: '⚡ Eşleştirme', q: 'Biz / Onlar', a: 'wir / sie', w: ['wir / Sie', 'ihr / sie', 'ich / er'] },
            { label: '⚡ Eşleştirme', q: 'Sen / Siz (Samimi)', a: 'du / ihr', w: ['du / Sie', 'er / sie', 'ich / wir'] }
        ];

        const POOL_DEDEKTIF = [
            { label: '🕵️ Dedektif', q: '<b>sie</b> trinkt Wasser.', hint: 'Fiil tekil: trinkt', a: 'O (Kadın)', w: ['Onlar', 'Siz (Resmi)', 'Biz'] },
            { label: '🕵️ Dedektif', q: '<b>sie</b> trinken Wasser.', hint: 'Fiil çoğul: trinken', a: 'Onlar', w: ['O (Kadın)', 'Siz (Resmi)', 'Biz'] },
            { label: '🕵️ Dedektif', q: 'Trinken <b>Sie</b> Wasser?', hint: 'Büyük harf!', a: 'Siz (Resmi)', w: ['O (Kadın)', 'Onlar', 'Sen'] },
            { label: '🕵️ Dedektif', q: '<b>sie</b> ist schön.', hint: 'ist = tekil', a: 'O (Kadın)', w: ['Onlar', 'Siz (Resmi)', 'Biz'] },
            { label: '🕵️ Dedektif', q: '<b>sie</b> sind schön.', hint: 'sind = çoğul, küçük harf', a: 'Onlar', w: ['O (Kadın)', 'Siz (Resmi)', 'Biz'] },
            { label: '🕵️ Dedektif', q: 'Sind <b>Sie</b> Herr Müller?', hint: 'Büyük harf!', a: 'Siz (Resmi)', w: ['O (Kadın)', 'Onlar', 'Sen'] },
            { label: '🕵️ Dedektif', q: '<b>sie</b> kauft ein Auto.', hint: 'kauft = tekil', a: 'O (Kadın)', w: ['Onlar', 'Siz (Resmi)', 'Biz'] },
            { label: '🕵️ Dedektif', q: '<b>sie</b> kaufen ein Auto.', hint: 'kaufen = çoğul', a: 'Onlar', w: ['O (Kadın)', 'Siz (Resmi)', 'Biz'] },
            { label: '🕵️ Dedektif', q: 'Was kaufen <b>Sie</b>?', hint: 'Büyük harf!', a: 'Siz (Resmi)', w: ['O (Kadın)', 'Onlar', 'Sen'] },
            { label: '🕵️ Dedektif', q: '<b>sie</b> arbeitet hier.', hint: 'arbeitet = tekil', a: 'O (Kadın)', w: ['Onlar', 'Siz (Resmi)', 'Biz'] },
            { label: '🕵️ Dedektif', q: '<b>sie</b> arbeiten hier.', hint: 'arbeiten = çoğul', a: 'Onlar', w: ['O (Kadın)', 'Siz (Resmi)', 'Biz'] },
            { label: '🕵️ Dedektif', q: 'Wo arbeiten <b>Sie</b>?', hint: 'Büyük harf!', a: 'Siz (Resmi)', w: ['O (Kadın)', 'Onlar', 'Sen'] },
            { label: '🕵️ Dedektif', q: '<b>sie</b> hat eine Katze.', hint: 'hat = tekil', a: 'O (Kadın)', w: ['Onlar', 'Siz (Resmi)', 'Biz'] },
            { label: '🕵️ Dedektif', q: '<b>sie</b> haben eine Katze.', hint: 'haben = çoğul', a: 'Onlar', w: ['O (Kadın)', 'Siz (Resmi)', 'Biz'] },
            { label: '🕵️ Dedektif', q: 'Haben <b>Sie</b> Zeit?', hint: 'Büyük harf!', a: 'Siz (Resmi)', w: ['O (Kadın)', 'Onlar', 'Sen'] },
            { label: '🕵️ Dedektif', q: '<b>sie</b> liest ein Buch.', hint: 'liest = tekil', a: 'O (Kadın)', w: ['Onlar', 'Siz (Resmi)', 'Biz'] },
            { label: '🕵️ Dedektif', q: '<b>sie</b> lesen ein Buch.', hint: 'lesen = çoğul', a: 'Onlar', w: ['O (Kadın)', 'Siz (Resmi)', 'Biz'] },
            { label: '🕵️ Dedektif', q: 'Lesen <b>Sie</b> gern?', hint: 'Büyük harf!', a: 'Siz (Resmi)', w: ['O (Kadın)', 'Onlar', 'Sen'] },
            { label: '🕵️ Dedektif', q: '<b>sie</b> spricht Deutsch.', hint: 'spricht = tekil', a: 'O (Kadın)', w: ['Onlar', 'Siz (Resmi)', 'Biz'] },
            { label: '🕵️ Dedektif', q: 'Sprechen <b>Sie</b> Deutsch?', hint: 'Büyük harf!', a: 'Siz (Resmi)', w: ['O (Kadın)', 'Onlar', 'Sen'] }
        ];

        const POOL_EKSIK = [
            { label: '🧩 Cümle Tamamlama', q: '___ lerne Deutsch.', hint: '-e takısı', a: 'ich', w: ['du', 'er', 'wir'] },
            { label: '🧩 Cümle Tamamlama', q: '___ lernst Deutsch.', hint: '-st takısı', a: 'du', w: ['ich', 'sie', 'ihr'] },
            { label: '🧩 Cümle Tamamlama', q: '___ lernt Deutsch. (Erkek)', hint: 'Erkek özne', a: 'er', w: ['ich', 'du', 'wir'] },
            { label: '🧩 Cümle Tamamlama', q: '___ lernen Deutsch. (Biz)', hint: 'Biz anlamında', a: 'wir', w: ['ich', 'du', 'ihr'] },
            { label: '🧩 Cümle Tamamlama', q: '___ lernt Deutsch. (Siz)', hint: 'Siz (samimi)', a: 'ihr', w: ['ich', 'du', 'wir'] },
            { label: '🧩 Cümle Tamamlama', q: '___ wohne in Berlin.', hint: '-e takısı', a: 'ich', w: ['du', 'er', 'sie'] },
            { label: '🧩 Cümle Tamamlama', q: 'Wohnst ___ in Berlin?', hint: '-st takısı', a: 'du', w: ['ich', 'er', 'ihr'] },
            { label: '🧩 Cümle Tamamlama', q: '___ wohnt in Berlin. (Kadın)', hint: 'Kadın özne', a: 'sie', w: ['ich', 'wir', 'du'] },
            { label: '🧩 Cümle Tamamlama', q: '___ wohnen in Berlin. (Onlar)', hint: 'Onlar anlamında', a: 'sie', w: ['er', 'ich', 'du'] },
            { label: '🧩 Cümle Tamamlama', q: 'Wohnen ___ in Berlin? (Resmi)', hint: 'Resmi Siz', a: 'Sie', w: ['du', 'ihr', 'er'] },
            { label: '🧩 Cümle Tamamlama', q: '___ trinke Kaffee.', hint: '-e takısı', a: 'ich', w: ['du', 'er', 'wir'] },
            { label: '🧩 Cümle Tamamlama', q: 'Trinkst ___ Kaffee?', hint: '-st takısı', a: 'du', w: ['ich', 'Sie', 'wir'] },
            { label: '🧩 Cümle Tamamlama', q: '___ trinken Tee. (Biz)', hint: 'Biz', a: 'wir', w: ['er', 'es', 'ich'] },
            { label: '🧩 Cümle Tamamlama', q: 'Trinkt ___ Tee? (Siz)', hint: 'Siz (samimi)', a: 'ihr', w: ['du', 'ich', 'Sie'] },
            { label: '🧩 Cümle Tamamlama', q: '___ bin Lehrer.', hint: 'bin = olmak (ben)', a: 'ich', w: ['du', 'er', 'wir'] },
            { label: '🧩 Cümle Tamamlama', q: 'Bist ___ Schüler?', hint: 'bist = olmak (sen)', a: 'du', w: ['ich', 'er', 'sie'] },
            { label: '🧩 Cümle Tamamlama', q: '___ ist Arzt. (Erkek)', hint: 'ist = olmak (o)', a: 'er', w: ['ich', 'wir', 'ihr'] },
            { label: '🧩 Cümle Tamamlama', q: '___ sind Freunde. (Biz)', hint: 'Biz', a: 'wir', w: ['er', 'ich', 'du'] },
            { label: '🧩 Cümle Tamamlama', q: 'Seid ___ bereit? (Siz)', hint: 'Siz (samimi)', a: 'ihr', w: ['wir', 'ich', 'Sie'] },
            { label: '🧩 Cümle Tamamlama', q: '___ haben ein Auto. (Onlar)', hint: 'Onlar', a: 'sie', w: ['er', 'ich', 'ihr'] }
        ];

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let canAnswer = true;
        let currentStageId = 1;

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function showStageSelection() {
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('stage-selection').classList.remove('hidden');
        }

        function startStage(stage) {
            currentStageId = stage;
            document.getElementById('stage-selection').classList.add('hidden');
            document.getElementById('quiz-card').classList.remove('hidden');

            let pool = [];

            if (stage === 1) {
                document.getElementById('current-stage-title').innerText = "Aşama 1: Hızlı Refleks";
                pool = [...POOL_REFLEKS];
            } else if (stage === 2) {
                document.getElementById('current-stage-title').innerText = "Aşama 2: Sie Dedektifi";
                pool = [...POOL_DEDEKTIF];
            } else if (stage === 3) {
                document.getElementById('current-stage-title').innerText = "Aşama 3: Eksik Parça";
                pool = [...POOL_EKSIK];
            } else if (stage === 4) {
                document.getElementById('current-stage-title').innerText = "Aşama 4: Karma Final";
                pool = [...POOL_REFLEKS, ...POOL_DEDEKTIF, ...POOL_EKSIK];
            }

            currentQuestions = shuffleArray(pool);
            if (stage === 4) {
                currentQuestions = currentQuestions.slice(0, 40);
            } else {
                currentQuestions = currentQuestions.slice(0, 20);
            }
            
            currentIndex = 0;
            score = 0;
            renderQuestion();
        }

        function renderQuestion() {
            canAnswer = true;
            const qData = currentQuestions[currentIndex];
            const total = currentQuestions.length;
            const currentNum = currentIndex + 1;

            document.getElementById('quiz-progress-text').innerText = `${currentNum} / ${total}`;
            document.getElementById('quiz-progress-bar').style.width = `${(currentNum / total) * 100}%`;

            document.getElementById('question-type-badge').innerText = qData.label;
            document.getElementById('question-text').innerHTML = qData.q;
            
            const hintEl = document.getElementById('question-hint');
            if (qData.hint) {
                hintEl.innerText = qData.hint;
                hintEl.classList.remove('hidden');
            } else {
                hintEl.classList.add('hidden');
            }

            let options = [qData.a, ...qData.w];
            let shuffledOptions = shuffleArray(options);

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            shuffledOptions.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full p-4 sm:p-5 bg-slate-900/80 border border-slate-700 rounded-2xl text-white font-bold text-lg sm:text-xl shadow-sm';
                btn.innerHTML = opt;
                btn.onclick = () => handleAnswer(btn, opt, qData.a);
                container.appendChild(btn);
            });
        }

        function handleAnswer(btnElement, selectedAnswer, correctAnswer) {
            if (!canAnswer) return;
            canAnswer = false; 

            const allButtons = document.querySelectorAll('.option-btn');
            
            if (selectedAnswer === correctAnswer) {
                score++;
                btnElement.classList.remove('bg-slate-900/80', 'border-slate-700');
                btnElement.classList.add('bg-emerald-600', 'border-emerald-500', 'shadow-[0_0_15px_rgba(16,185,129,0.4)]');
            } else {
                btnElement.classList.remove('bg-slate-900/80', 'border-slate-700');
                btnElement.classList.add('bg-rose-600', 'border-rose-500');
                
                allButtons.forEach(b => {
                    if (b.innerHTML === correctAnswer) {
                        b.classList.remove('bg-slate-900/80', 'border-slate-700');
                        b.classList.add('bg-emerald-600/50', 'border-emerald-500', 'opacity-90');
                    }
                });
            }

            allButtons.forEach(b => b.disabled = true);

            setTimeout(() => {
                currentIndex++;
                if (currentIndex < currentQuestions.length) {
                    renderQuestion();
                } else {
                    finishStage();
                }
            }, 1000);
        }

        function finishStage() {
            const modal = document.getElementById('result-modal');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const scoreDisplay = document.getElementById('result-score');
            const icon = document.getElementById('result-icon');
            const nextBtn = document.getElementById('btn-next-action');
            
            const total = currentQuestions.length;
            const successRate = score / total;
            scoreDisplay.innerText = `${score} / ${total}`;

            if (successRate === 1) {
                title.innerText = 'Kusursuz!';
                desc.innerText = 'Mükemmel iş çıkardın! Bu aşamayı hatasız tamamladın.';
                icon.innerHTML = '👑';
                icon.className = "w-24 h-24 mx-auto rounded-[2rem] bg-gradient-to-br from-yellow-300 to-amber-500 text-slate-900 flex items-center justify-center text-5xl shadow-lg shadow-amber-500/50 mb-2";
                if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 }, colors: ['#10b981', '#14b8a6', '#fbbf24'] });
            } else if (successRate >= 0.75) {
                title.innerText = 'Çok İyi!';
                desc.innerText = 'Temel mantığı çok iyi kavramışsın. Ufak tefek hataları kapatmak için bir kez daha çözebilirsin.';
                icon.innerHTML = '👍';
                icon.className = "w-24 h-24 mx-auto rounded-[2rem] bg-gradient-to-br from-sky-400 to-blue-500 text-white flex items-center justify-center text-5xl shadow-lg shadow-sky-500/30 mb-2";
            } else {
                title.innerText = 'Daha Çok Pratik!';
                desc.innerText = `Toplam ${total} soruda ${score} doğru yaptın. Sonraki aşamaya geçmek için en az %75 başarı gereklidir. Lütfen tekrar dene!`;
                icon.innerHTML = '💪';
                icon.className = "w-24 h-24 mx-auto rounded-[2rem] bg-gradient-to-br from-rose-600 to-red-800 text-white flex items-center justify-center text-5xl shadow-lg shadow-rose-900/30 mb-2";
            }

            // ÇÖZÜM: Önce modal kapatılır, ardından yeni aşama veya tekrar başlatma tetiklenir
            if (currentStageId < 4 && successRate >= 0.75) {
                nextBtn.innerHTML = `Sonraki Aşama (${currentStageId + 1}) <i class="fa-solid fa-play ml-1"></i>`;
                nextBtn.onclick = () => {
                    modal.classList.add('hidden'); // Modalı kapat
                    startStage(currentStageId + 1); // Sonraki aşamaya geç
                };
            } else {
                nextBtn.innerHTML = 'Tekrar Dene <i class="fa-solid fa-rotate-right ml-1"></i>';
                nextBtn.onclick = () => {
                    modal.classList.add('hidden'); // Modalı kapat
                    startStage(currentStageId); // Aynı aşamayı baştan başlat
                };
            }

            modal.classList.remove('hidden');
        }
    </script>
</body>
</html>
